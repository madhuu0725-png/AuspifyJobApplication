{% extends 'base.html' %}

{% block title %}Create Account — JobConnect{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding: 4rem 1.5rem 6rem;">
  <div class="card" style="max-width: 520px; margin: 0 auto; padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon-box" style="margin: 0 auto 1rem; width: 48px; height: 48px;">
        <i data-lucide="user-plus" style="width: 24px; height: 24px;"></i>
      </div>
      <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 800;">Join JobConnect</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem;">Create your free account to get started</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
      <!-- Role Picker -->
      <div class="form-group">
        <label class="form-label">I want to:</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <label style="border: 2px solid var(--border-subtle); border-radius: var(--radius-md); padding: 0.85rem; display: flex; flex-direction: column; align-items: center; gap: 0.35rem; cursor: pointer; text-align: center;" id="roleSeekerCard">
            <input type="radio" name="role" value="seeker" checked onchange="toggleRoleUI('seeker')" style="accent-color: var(--primary);">
            <strong style="font-size: 0.95rem;">Find a Job</strong>
            <span style="font-size: 0.78rem; color: var(--text-muted);">Job Seeker</span>
          </label>

          <label style="border: 2px solid var(--border-subtle); border-radius: var(--radius-md); padding: 0.85rem; display: flex; flex-direction: column; align-items: center; gap: 0.35rem; cursor: pointer; text-align: center;" id="roleEmployerCard">
            <input type="radio" name="role" value="employer" onchange="toggleRoleUI('employer')" style="accent-color: var(--primary);">
            <strong style="font-size: 0.95rem;">Hire Talent</strong>
            <span style="font-size: 0.78rem; color: var(--text-muted);">Employer</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regName">Full Name</label>
        <input type="text" id="regName" name="name" class="form-control" placeholder="Alex Morgan" required>
      </div>

      <div class="form-group" id="companyField" style="display: none;">
        <label class="form-label" for="regCompany">Company / Organization Name</label>
        <input type="text" id="regCompany" name="company_name" class="form-control" placeholder="Acme Technologies Inc.">
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">Email Address</label>
        <input type="email" id="regEmail" name="email" class="form-control" placeholder="name@domain.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">Password</label>
        <input type="password" id="regPassword" name="password" class="form-control" placeholder="Create a strong password" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
        <i data-lucide="check" style="width: 18px; height: 18px;"></i>
        <span>Create My Account</span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 700;">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function toggleRoleUI(role) {
  const companyField = document.getElementById('companyField');
  if (role === 'employer') {
    companyField.style.display = 'block';
  } else {
    companyField.style.display = 'none';
  }
}
</script>
{% endblock %}
