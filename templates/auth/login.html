{% extends 'base.html' %}

{% block title %}Sign In — JobConnect{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding: 4rem 1.5rem 6rem;">
  <div class="card" style="max-width: 480px; margin: 0 auto; padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon-box" style="margin: 0 auto 1rem; width: 48px; height: 48px;">
        <i data-lucide="lock" style="width: 24px; height: 24px;"></i>
      </div>
      <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 800;">Welcome Back</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem;">Sign in to manage your jobs or applications</p>
    </div>

    <!-- Quick Demo Accounts Assist -->
    <div style="background: var(--bg-surface); border: 1px dashed var(--border-strong); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.75rem;">
      <div style="font-size: 0.78rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;">
        Quick Demo Sign-In:
      </div>
      <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
        <button type="button" class="btn btn-outline btn-sm" onclick="fillDemo('seeker@jobportal.com', 'seeker123')">
          Candidate
        </button>
        <button type="button" class="btn btn-outline btn-sm" onclick="fillDemo('employer@nexus.io', 'employer123')">
          Employer
        </button>
        <button type="button" class="btn btn-outline btn-sm" onclick="fillDemo('admin@jobportal.com', 'admin123')">
          Admin
        </button>
      </div>
    </div>

    <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@company.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
        <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
        <span>Sign In</span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account yet? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 700;">Create Account</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function fillDemo(email, pass) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = pass;
}
</script>
{% endblock %}
